bundle:
  name: telco-zero-to-hero

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo de Unity Catalog para el workshop
    default: telco_workshop
  schema:
    description: Schema del workshop
    default: red_calidad
  warehouse_id:
    description: ID del SQL Warehouse usado por SQL, Genie y Databricks Apps

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  include:
    - notebooks/**
    - src/**
    - config/**
    - apps/**
    - data/generated/**

targets:
  dev:
    default: true
    mode: development
  smoke:
    mode: development
  shared:
    mode: production
