resources:
  apps:
    network_monitor:
      name: "telco-zero-to-hero-${bundle.target}"
      source_code_path: ../apps/network-monitor
      description: "Plantilla inicial sintética de red, clientes y productos para el workshop"
      config:
        command:
          - streamlit
          - run
          - app.py
          - --server.address=0.0.0.0
          - --server.port=8000
          - --server.headless=true
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: TELCO_CATALOG
            value: ${var.catalog}
          - name: TELCO_SCHEMA
            value: ${var.schema}
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: gold-network-hourly
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.gold_network_hourly
            permission: SELECT
        - name: gold-site-daily-360
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.gold_site_daily_360
            permission: SELECT
        - name: gold-customer-360
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.gold_customer_360
            permission: SELECT
        - name: gold-customer-product-daily
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.gold_customer_product_daily
            permission: SELECT
        - name: gold-incident-impact
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.gold_incident_impact
            permission: SELECT
