resources:
  jobs:
    prepare_workshop:
      name: "[${bundle.target}] Telco Workshop - Preparar Dados"
      tasks:
        - task_key: generate_synthetic_data
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              seed: "42"
          environment_key: serverless_env
      environments:
        - environment_key: serverless_env
          spec:
            client: "4"

