command:
  - streamlit
  - run
  - app.py
  - --server.address=0.0.0.0
  - --server.port=8000
  - --server.headless=true

# El bundle sobrescribe estas variables con valores suministrados en el deploy.
# `valueFrom` mantiene el ID del Warehouse fuera del repositorio en despliegues
# manuales que asocian el recurso con el nombre `sql-warehouse`.
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
